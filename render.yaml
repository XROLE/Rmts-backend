services:
  - type: web
    name: roommate-ng-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: '*'
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SIDO_REGISTRATION_URL
        value: https://urban-nest-tawny.vercel.app/
        sync: false
      - key: SIDO_HANDOVER_PAUSE_BOT
        value: 'false'
        sync: false
      - key: WHATSAPP_WELCOME_TEMPLATE_NAME
        value: welcome_to_roommate_ng
        sync: false
      - key: WHATSAPP_WELCOME_TEMPLATE_LANG
        value: en_US
        sync: false
      - key: WHATSAPP_WELCOME_TEMPLATE_ENABLED
        value: 'true'
        sync: false